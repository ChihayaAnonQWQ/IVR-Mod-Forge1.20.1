pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

def sharedProperties = new Properties()
def sharedPropertiesFile = file('../gradle.properties')
if (sharedPropertiesFile.isFile()) {
    sharedPropertiesFile.withInputStream { sharedProperties.load(it) }
}

gradle.beforeProject { project ->
    sharedProperties.each { key, value ->
        if (!project.hasProperty(key)) {
            project.ext.set(key.toString(), value.toString())
        }
    }
}

rootProject.name = 'fabric'

// These are real Gradle subprojects. Keep the directory mapping explicit so
// the settings file works regardless of the current Gradle invocation path.
// Only include versions whose local MTR jar is present; upstream checkouts do
// not commit the large MTR jars, and this branch focuses on 1.20.1.
['1_16_5', '1_17_1', '1_18_2', '1_19_2', '1_19_4', '1_20_1'].each { version ->
    def libDir = file("$version/lib")
    if (libDir.isDirectory() && (libDir.listFiles()?.any { it.name.endsWith('.jar') })) {
        include(version)
        project(":$version").projectDir = file(version)
    }
}
