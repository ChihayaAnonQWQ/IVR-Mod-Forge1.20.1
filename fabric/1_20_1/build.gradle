plugins {
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'fabric-loom' version '1.10.5'
}

loom {
    mixin {
        defaultRefmapName = 'IVR-refmap.json'
    }
    runs {
        client {
            client()
            runDir 'run'
            if (project.hasProperty('quickplayWorld')) {
                programArgs '--quickPlaySingleplayer', project.property('quickplayWorld').toString()
            }
        }
    }
}

sourceSets {
    // Compile-time-only shape of the optional MSD classes used by the optional
    // MSDRigidCatenaryRenderMixin; the real MSD mod is never packaged.
    msdStub {
        java.srcDirs = ['../../forge-1.20.1/stubs/msd/java']
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation files("lib/MTR-fabric-1.20-3.2.2-hotfix-1.jar")
    compileOnly sourceSets.msdStub.output

    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
