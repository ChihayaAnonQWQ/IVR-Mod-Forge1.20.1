plugins {
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'fabric-loom' version '1.10.5'
}

loom {
    mixin {
        defaultRefmapName = 'IVR-refmap.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation(files("lib/MTR-fabric-1.17.1-3.2.2-hotfix-1.jar"))
    modImplementation(files("lib/MTR-MSD-Addon-fabric-1.17.1-3.2.2-1.3.4-enhancement-1.jar"))
    modImplementation(files("lib/MTR-ANTE-1.2.0-DEV-19+1.17.1.jar"))

    // Common:
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
}
