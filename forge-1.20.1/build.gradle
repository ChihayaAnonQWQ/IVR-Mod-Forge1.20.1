plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base.archivesName = "${archives_base_name}-FORGE-mc${minecraft_version}-mtr3"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            mods { ivr { source sourceSets.main } }
            if (project.hasProperty('quickplayWorld')) {
                args '--quickPlaySingleplayer', project.property('quickplayWorld')
            }
        }
        server {
            workingDirectory project.file('run-server')
            args 'nogui'
            mods { ivr { source sourceSets.main } }
        }
    }
}

// The port reuses the multiloader upstream tree as-is: common code + the shared
// Forge entry point + the MC-1.20.1 platform implementation in this project.
sourceSets {
    main {
        java.srcDirs = [
                '../common/main/java',
                '../forge/src/main/java',
                'src/main/java'
        ]
        resources.srcDirs = [
                '../common/main/resources',
                '../forge/src/main/resources',
                'src/main/resources'
        ]
    }
    // Compile-time-only shape of the optional MSD classes referenced by
    // MSDRigidCatenaryRenderMixin. Never packaged: the optional mixin plugin
    // only applies that mixin when the real MSD mod is installed.
    msdStub {
        java.srcDirs = ['stubs/msd/java']
    }
}

mixin {
    add sourceSets.main, 'IVR-refmap.json'
    config 'IVR.mixins.json'
    config 'ksd.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MTR 3.2.2 for Forge 1.20.1: classes live in mtr.* (MTR 4 uses org.mtr.*).
    // fg.deobf is required because IVR implements/extends MTR classes whose
    // signatures carry the Minecraft types.
    compileOnly fg.deobf("maven.modrinth:minecraft-transit-railway:${mtr_modrinth_version}")
    testCompileOnly fg.deobf("maven.modrinth:minecraft-transit-railway:${mtr_modrinth_version}")
    compileOnly sourceSets.msdStub.output

    // MixinExtras @Local support (two KSD screen mixins). The common annotations
    // are compile-time only; the Forge implementation jar is bundled below.
    // Forge's JarJar needs a version RANGE, not a single pinned version.
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.5'))
    jarJar('io.github.llamalad7:mixinextras-forge:[0.5.5,0.6.0)') { transitive = false }
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.5.5'
}

// Opt-in runtime dependencies for local dev smoke tests (runClient/runServer).
// -PivrMtr363 selects the Yomi's MTR 3.6.3 fork instead of official 3.2.2.
if (project.hasProperty('ivrRuntimeTest')) {
    dependencies {
        runtimeOnly fg.deobf(project.hasProperty('ivrMtr363')
                ? 'maven.modrinth:ymtr:1.20.1-3.6.3'
                : "maven.modrinth:minecraft-transit-railway:${mtr_modrinth_version}")
        // MTR 3 declares Architectury as a mandatory dependency.
        runtimeOnly fg.deobf("maven.modrinth:architectury-api:${architectury_forge_version}+forge")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

processResources {
    // MTR 3's mods.toml reports "1.20.1-3.2.2-hotfix-2", so the dependency
    // range pins MTR 3 and rejects MTR 4.
    inputs.properties(
            mod_version: project.mod_version,
            minecraft_version: project.minecraft_version,
            mtr_version: project.mtr_version,
            pack_format: 15
    )
    filesMatching('META-INF/mods.toml') {
        expand(
                mod_version: project.mod_version,
                minecraft_version: project.minecraft_version,
                mtr_version: project.mtr_version
        )
    }
    filesMatching('pack.mcmeta') {
        expand(pack_format: 15)
    }
}

jar {
    manifest {
        attributes('MixinConfigs': 'IVR.mixins.json,ksd.mixins.json')
    }
    finalizedBy 'reobfJar'
}

jarJar.enable()
