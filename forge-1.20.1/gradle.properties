org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# Local JDK 17 for the Java 17 toolchain (Gradle itself runs on JDK 21).
# ForgeGradle aborts on a flaky TLS handshake with maven.minecraftforge.net.
systemProp.net.minecraftforge.gradle.check.certs=false

minecraft_version=1.20.1
forge_version=47.4.0
mod_version=1.2-pre-release-r7
maven_group=net.hulan
archives_base_name=IVR
# MTR 3.2.2 for Forge 1.20.1 (the last MTR 3 release for this MC version).
mtr_version=1.20.1-3.2.2-hotfix-2
mtr_modrinth_version=1.20.1-3.2.2-hotfix-2
# Architectury is a mandatory dependency of MTR 3's mods.toml.
architectury_forge_version=9.2.14

# English compiler diagnostics.
systemProp.user.language=en
systemProp.user.country=US
