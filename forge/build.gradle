plugins {
    id 'com.modrinth.minotaur' version '2.8.7' apply false
}

def modrinthConfig = new Properties()
def modrinthConfigFile = file('../modrinth.properties')
if (modrinthConfigFile.isFile()) {
    modrinthConfigFile.withInputStream { modrinthConfig.load(it) }
}
ext.modrinthConfig = modrinthConfig
ext.modrinthChangelogFile = file('../CHANGELOG.md')
def modrinthGameVersions = [
    '1.16.5': ['1.16', '1.16.1', '1.16.2', '1.16.3', '1.16.4', '1.16.5'],
    '1.17.1': ['1.17', '1.17.1'],
    '1.18.2': ['1.18', '1.18.1', '1.18.2'],
    '1.19.2': ['1.19', '1.19.1', '1.19.2'],
    '1.19.4': ['1.19.3', '1.19.4']
]

allprojects {
    version = property('mod_version')
    group = findProperty('maven_group') ?: 'net.hulan'

    repositories {
        // Loom 1.13 upgrades Minecraft's LWJGL libraries to 3.3.2 and
        // resolves them from this explicitly named repository.
        maven {
            name = 'MavenCentralLWJGL'
            url = 'https://maven.aliyun.com/repository/central/'
            content { includeGroup 'org.lwjgl' }
        }
        maven {
            name = 'MavenCentralLWJGLFallback'
            url = 'https://repo.maven.apache.org/maven2/'
            content { includeGroup 'org.lwjgl' }
        }
        mavenCentral()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'MinecraftLibraries'; url = 'https://libraries.minecraft.net/' }
    }
}

subprojects {
    apply plugin: 'java-library'

    dependencies {
        implementation 'com.google.code.gson:gson:2.14.0'
    }

    sourceSets {
        main {
            java.srcDirs = ['../../common/main/java', '../src/main/java', 'src/main/java']
            resources.srcDirs = ['../../common/main/resources', '../src/main/resources']
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(ProcessResources).configureEach {
        def packFormats = ['1.16.5': 6, '1.17.1': 7, '1.18.2': 8, '1.19.2': 9, '1.19.4': 13]
        filesMatching('pack.mcmeta') {
            expand(pack_format: packFormats[project.minecraft_version] ?: 8)
        }
        filesMatching('META-INF/mods.toml') {
            expand(project.properties)
        }
    }

    tasks.withType(Jar).configureEach {
        manifest {
            attributes('MixinConfigs': 'IVR.mixins.json,ksd.mixins.json')
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
        archivesBaseName = "IVR-FORGE-${project.minecraft_version}"
    }

    // Keep the remapped Forge jars together in the root mods directory,
    // matching the output workflow used by the Fabric project.
    plugins.withId('dev.architectury.loom') {
        tasks.named('remapJar') {
            destinationDirectory = file('../mods')
        }

        tasks.register('copyJar', Delete) {
            delete layout.buildDirectory.dir('devlibs')
        }

        tasks.named('assemble') {
            finalizedBy 'copyJar'
        }

        def config = rootProject.ext.modrinthConfig
        def modrinthToken = config.getProperty('token', '')
        def modrinthProjectId = config.getProperty('project_id_forge',
            config.getProperty('project_id', ''))
        def modrinthProjectName = config.getProperty('project_name', 'IVR')
        def modrinthVersionType = config.getProperty('version_type', 'release')
        def version = project.version
        def changelogFile = rootProject.ext.modrinthChangelogFile

        modrinth {
            token = modrinthToken
            projectId = modrinthProjectId
            versionNumber = "${version}-${project.minecraft_version}-forge"
            versionName = "${modrinthProjectName} ${version} - Forge ${project.minecraft_version}"
            versionType = modrinthVersionType
            uploadFile = tasks.named('remapJar')
            gameVersions = modrinthGameVersions[project.minecraft_version] ?: [project.minecraft_version]
            loaders = ['forge']
            if (changelogFile.isFile()) {
                changelog = changelogFile.getText('UTF-8')
            }
        }

        tasks.register('publishModrinth') {
            group = 'publishing'
            description = 'Uploads the remapped Forge jar to Modrinth.'
            dependsOn tasks.named('remapJar')
            dependsOn tasks.named('modrinth')
        }
    }
}

tasks.register('publishModrinth') {
    group = 'publishing'
    description = 'Uploads all Forge versions to Modrinth.'
    dependsOn subprojects.collect { it.tasks.named('publishModrinth') }
}
