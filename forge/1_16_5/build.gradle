plugins {
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'dev.architectury.loom' version '1.13.469'
}

loom {
    silentMojangMappingsLicense()
    mixin {
        defaultRefmapName = 'IVR-refmap.json'
    }
    forge {
        mixinConfigs 'IVR.mixins.json', 'ksd.mixins.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    modImplementation 'me.shedaniel:architectury-forge:1.32.66'
    modImplementation(files("lib/MTR-forge-1.16.5-3.2.2-hotfix-1.jar"))
    modImplementation(files("lib/MTR-MSD-Addon-forge-1.16.5-3.2.2-1.3.4-enhancement-1.jar"))
    implementation 'com.google.code.gson:gson:2.14.0'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.2.2'))
    implementation(include('io.github.llamalad7:mixinextras-forge:0.2.2'))
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
}

architectury { minecraft = project.minecraft_version }

